<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>LabourBook - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#eae7e7",
                        "on-tertiary-fixed": "#3e0500",
                        "surface-container": "#f0eded",
                        "on-primary-fixed-variant": "#274e3d",
                        "surface": "#fcf9f8",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#bbc8d3",
                        "on-secondary-fixed-variant": "#3c4851",
                        "surface-variant": "#e4e2e1",
                        "primary": "#012d1d",
                        "outline": "#717973",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#ffdad3",
                        "background": "#fcf9f8",
                        "inverse-primary": "#a5d0b9",
                        "on-primary-container": "#86af99",
                        "surface-container-low": "#f6f3f2",
                        "surface-container-highest": "#e4e2e1",
                        "primary-container": "#1b4332",
                        "secondary-container": "#d7e4f0",
                        "on-secondary-container": "#596670",
                        "surface-bright": "#fcf9f8",
                        "on-error": "#ffffff",
                        "tertiary": "#510900",
                        "primary-fixed": "#c1ecd4",
                        "inverse-surface": "#303030",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#ff8266",
                        "on-surface": "#1b1c1c",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#414844",
                        "outline-variant": "#c1c8c2",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#dcd9d9",
                        "secondary": "#53606a",
                        "on-secondary-fixed": "#111d25",
                        "on-primary": "#ffffff",
                        "on-background": "#1b1c1c",
                        "on-primary-fixed": "#002114",
                        "primary-fixed-dim": "#a5d0b9",
                        "inverse-on-surface": "#f3f0f0",
                        "tertiary-fixed-dim": "#ffb4a4",
                        "surface-tint": "#3f6653",
                        "secondary-fixed": "#d7e4f0",
                        "on-tertiary-fixed-variant": "#8c1700",
                        "tertiary-container": "#781300"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin": "24px",
                        "sidebar-width": "280px",
                        "gutter": "16px",
                        "base": "8px",
                        "drawer-width": "400px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "display-currency": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "display-currency": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .material-symbols-outlined {
                font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            }
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary">
<main class="flex-grow flex items-center justify-center p-4 sm:p-8">
<div class="w-full max-w-[440px] bg-surface-container-lowest border border-outline-variant rounded-lg p-8 sm:p-10">
<div class="mb-10 text-center sm:text-left">
<div class="text-headline-md font-headline-md font-extrabold text-primary tracking-tight">LabourBook</div>
</div>
<div class="mb-8">
<h1 class="text-headline-lg font-headline-lg text-on-surface mb-2">Welcome back</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Manage your farm labour, attendance and payments in one place.</p>
</div>
<form class="space-y-6" onsubmit="event.preventDefault();">
<div class="space-y-2">
<label class="block text-label-caps font-label-caps text-on-surface uppercase" for="username">Mobile number / Username</label>
<input class="w-full h-[48px] px-4 bg-surface-container-lowest border border-outline-variant rounded text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="username" name="username" placeholder="Enter your mobile or username" required="" type="text">
</div>
<div class="space-y-2">
<label class="block text-label-caps font-label-caps text-on-surface uppercase" for="password">Password</label>
<input class="w-full h-[48px] px-4 bg-surface-container-lowest border border-outline-variant rounded text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
<div class="flex items-center justify-between pt-2">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant text-primary-container focus:ring-primary-container cursor-pointer" type="checkbox">
<span class="text-body-md font-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="text-body-md font-body-md text-primary-container font-medium hover:underline focus:outline-none focus:ring-2 focus:ring-primary-container rounded px-1" href="#">
                        Forgot password?
                    </a>
</div>
<div class="pt-4">
<button class="w-full h-[48px] bg-primary-container text-on-primary rounded-lg text-body-md font-body-md font-medium hover:bg-opacity-90 active:bg-opacity-100 transition-all focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-background" type="submit">
                        Login
                    </button>
</div>
</form>
</div>
</main>
</body></html>
